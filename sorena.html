<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>سورنا | موسیقی برای هر لحظه</title>
<link rel="stylesheet" href="sorena.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>
</head>
<body>
<div class="app" id="app">
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a class="logo" href="/">
        <div class="logo-icon">س</div>
        <span class="logo-text">سورنا</span>
      </a>
      <nav class="nav">
        <a href="#" class="nav-link active" data-section="new">جدید</a>
        <a href="#" class="nav-link" data-section="albums">آلبوم‌ها</a>
        <a href="#" class="nav-link" data-section="playlists">پلی‌لیست</a>
        <a href="#" class="nav-link" data-section="dj">میکس دی‌جی</a>
      </nav>
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input type="search" id="searchInput" placeholder="جستجو..." autocomplete="off">
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main" id="main">
    <!-- Loading State -->
    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <p>در حال بارگذاری...</p>
    </div>

    <!-- Error State -->
    <div class="error-state" id="errorState" style="display:none">
      <div class="error-icon">⚠️</div>
      <h3>خطا در بارگذاری</h3>
      <p id="errorMessage">اتصال به سرور برقرار نشد</p>
      <button class="btn btn-primary" onclick="loadData()">تلاش مجدد</button>
    </div>

    <!-- Content Container -->
    <div class="content" id="content" style="display:none">
      <!-- Category Chips -->
      <section class="section section-categories" id="section-categories">
        <div class="section-header"><h2 class="section-title">دسته‌بندی‌ها</h2></div>
        <div class="category-chips" id="categoryChips"></div>
      </section>

      <!-- Hero Section (Featured) -->
      <section class="section section-hero" id="section-hero"></section>

      <!-- Banners Carousel -->
      <section class="section section-banners" id="section-banners"></section>

      <!-- Dynamic Sections -->
      <div id="sectionsContainer"></div>

      <!-- Category Grid (shown when a category is picked) -->
      <div id="categoryView" style="display:none"></div>
    </div>
  </main>

  <!-- Collection Modal -->
  <div class="modal" id="collectionModal">
    <div class="modal-backdrop" onclick="closeCollection()"></div>
    <div class="modal-content">
      <button class="modal-close" onclick="closeCollection()">✕</button>
      <div class="modal-header" id="modalHeader"></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Audio Player -->
  <div class="player" id="player">
    <div class="player-info">
      <img class="player-cover" id="playerCover" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23333' width='100' height='100'/%3E%3C/svg%3E" alt="کاور">
      <div class="player-text">
        <div class="player-title" id="playerTitle">آهنگی انتخاب نشده</div>
        <div class="player-artist" id="playerArtist">از سورنا</div>
      </div>
    </div>
    <div class="player-controls">
      <button class="player-btn" id="prevBtn" aria-label="آهنگ قبلی">⏮</button>
      <button class="player-btn player-btn-main" id="playBtn" aria-label="پخش">▶</button>
      <button class="player-btn" id="nextBtn" aria-label="آهنگ بعدی">⏭</button>
    </div>
    <div class="player-progress">
      <span class="player-time" id="currentTime">0:00</span>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="player-time" id="totalTime">0:00</span>
    </div>
    <div class="player-volume">
      <span>🔊</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.7">
    </div>
    <div class="player-actions">
      <a class="player-action" id="downloadBtn" href="#" download style="display:none" title="دانلود">⬇</a>
    </div>
  </div>

  <audio id="audio" preload="none"></audio>
</div>

<script src="sorena.js"></script>
</body>
</html>
